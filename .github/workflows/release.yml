name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            binary: doccraft
            archive: doccraft-v0.9.0-linux-x86_64.tar.gz
          - name: macos-arm64
            os: macos-15
            binary: doccraft
            archive: doccraft-v0.9.0-macos-arm64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            binary: doccraft.exe
            archive: doccraft-v0.9.0-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DDOCCRAFT_WARNINGS_AS_ERRORS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test
        if: runner.os != 'Windows'
        run: ./build/src/cli/doccraft inspect tests/corpus/corpus/plain-text.doc
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/doccraft
          cp build/src/cli/${{ matrix.binary }} dist/doccraft/
          cp README.md LICENSE dist/doccraft/
          tar -czf ${{ matrix.archive }} -C dist doccraft
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/doccraft | Out-Null
          Copy-Item build/src/cli/Release/${{ matrix.binary }} dist/doccraft/
          Copy-Item README.md, LICENSE dist/doccraft/
          Compress-Archive -Path dist/doccraft -DestinationPath ${{ matrix.archive }}
          $hash = (Get-FileHash ${{ matrix.archive }} -Algorithm SHA256).Hash
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii ${{ matrix.archive }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: doccraft v0.9.0
          body: |
            First public release. Single-binary .doc → .docx converter,
            clean-room [MS-CFB]/[MS-DOC] parser, no runtime dependencies.

            - 92% conversion rate over a 680-document real-world corpus, zero crashes
            - 100 MiB document in 4 s (median, recorded baseline)
            - RC4 family + XOR decryption with `--password`
            - Tables, fields, bookmarks, comments, footnotes, images, text boxes
            - C API for embedding (`src/api/doccraft_api.h`)

            See README.md for the platform matrix and known limits.
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
